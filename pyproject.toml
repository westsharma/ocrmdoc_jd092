[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "westsharma-ocrmdoc_jd092"
version = "0.1.0"
description = "从样本里推断OCR 文档理解工程师·推理服务的限流与排队应有的字段集合，逐字段检查存在性与类型，缺失项单独列出"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "westsharma" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://westsharma.github.io"
Repository = "https://github.com/westsharma/ocrmdoc_jd092"
Issues = "https://github.com/westsharma/ocrmdoc_jd092/issues"

[project.scripts]
ocrmdoc_jd092 = "ocrmdoc_jd092:main"

[tool.setuptools]
py-modules = ["ocrmdoc_jd092"]
